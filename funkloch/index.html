<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Funkloch – Stimmen aus Europa</title>
<link rel="stylesheet" href="css/stil.css">
</head>
<body>

<!-- Die ganze Szene wird in dieses Canvas gedruckt -->
<canvas id="leinwand" aria-label="Spielszene"></canvas>

<!-- Oberfläche wie Heftseiten -->
<div id="ui">
  <div id="stationskarte" class="karte klebeband">
    <div class="karte-titel"></div>
    <div class="karte-unter"></div>
  </div>

  <div id="stempel" class="stempel"></div>

  <button id="geraet" type="button" class="geraet-knopf" aria-label="Aufnahmegerät">
    <svg viewBox="0 0 64 48" aria-hidden="true">
      <rect x="4" y="10" width="56" height="34" rx="5" class="g-koerper"/>
      <rect x="8" y="14" width="48" height="26" rx="3" class="g-versatz"/>
      <circle cx="20" cy="27" r="8" class="g-spule"/><circle cx="20" cy="27" r="3" class="g-loch"/>
      <circle cx="44" cy="27" r="8" class="g-spule"/><circle cx="44" cy="27" r="3" class="g-loch"/>
      <rect x="26" y="24" width="12" height="6" class="g-band"/>
      <line x1="48" y1="10" x2="56" y2="2" class="g-antenne"/>
      <circle cx="54" cy="16" r="2.4" class="g-led"/>
    </svg>
    <span id="geraet-zahl" class="geraet-zahl">0</span>
    <span class="taste">R</span>
  </button>

  <button id="hinweis" type="button" class="hinweis-zettel"></button>

  <div id="blase" class="sprechblase" role="dialog" aria-live="polite">
    <div class="blase-schatten"></div>
    <div class="blase-koerper">
      <div class="blase-name"></div>
      <div class="blase-text"></div>
      <button type="button" class="blase-zu">✕</button>
    </div>
  </div>

  <div id="zettel-reihe" class="zettel-reihe"></div>

  <div id="steuerung" class="steuerung-zettel"></div>
  <div id="toast" class="toast"></div>
  <div id="debug" class="debug-feld"></div>
</div>

<noscript><p class="noscript">Bitte JavaScript einschalten, um „Funkloch“ zu spielen.</p></noscript>

<!-- Reihenfolge ist wichtig: erst Daten, dann Zeichensystem, dann Spiel -->
<script src="data/stil.js"></script>
<script src="data/fakten.js"></script>
<script src="data/texte.js"></script>
<script src="data/figuren.js"></script>
<script src="data/stationen.js"></script>
<script src="data/dialoge.js"></script>

<script src="js/zeichnen/grundlagen.js"></script>
<script src="js/zeichnen/raster.js"></script>
<script src="js/zeichnen/druck.js"></script>
<script src="js/zeichnen/sammler.js"></script>
<script src="js/zeichnen/objekte.js"></script>
<script src="js/zeichnen/figur.js"></script>
<script src="js/zeichnen/ebenen.js"></script>

<script src="js/spiel/eingabe.js"></script>
<script src="js/spiel/szene.js"></script>
<script src="js/spiel/blasen.js"></script>

<script src="js/debug.js"></script>
<script src="js/start.js"></script>
</body>
</html>
