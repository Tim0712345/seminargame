<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mehrheit – Ein Gesetz gegen die Lohnlücke. Lernspiel zum Gender Pay Gap in Europa.">
<title>Mehrheit – Ein Gesetz gegen die Lohnlücke</title>
<link rel="stylesheet" href="css/stil.css">
</head>
<body>
<div id="buehne">
  <canvas id="bild" aria-hidden="true"></canvas>
  <div id="blende" class="zu"></div>
</div>
<p id="szenenText" class="nur-vorleser" aria-live="polite"></p>
<p id="halbrundText" class="nur-vorleser" aria-live="polite"></p>

<main id="oberflaeche">
  <nav id="titelMenue" class="versteckt" aria-label="Hauptmenü"></nav>
  <p id="erfundenHinweis" class="versteckt"></p>
  <p id="titelTipp" class="versteckt"></p>

  <div id="kopfKnoepfe" class="versteckt">
    <button id="knopfPause" class="knopf glas" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>

  <section id="probe" class="glas versteckt" aria-label="Stil-Prototyp"></section>

  <section id="leiste" class="glas versteckt" aria-label="Gespräch">
    <div id="leisteKopf"><span id="leisteName"></span><span id="leisteRolle"></span></div>
    <p id="leisteText" aria-live="polite"></p>
    <div id="leisteAntworten" class="versteckt"></div>
    <button id="leisteWeiter" class="knopf versteckt" type="button"></button>
    <button id="leisteZu" class="knopf" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke:currentColor;stroke-width:2;fill:none"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </section>

  <div id="kapitelKarte" class="versteckt" role="status"></div>
  <div id="hinweis" class="glas versteckt" role="status"></div>

  <div id="fenster" class="versteckt" role="dialog" aria-modal="true" aria-labelledby="fensterTitel">
    <div id="fensterKarte" class="glas">
      <h2 id="fensterTitel"></h2>
      <button id="fensterZu" class="knopf" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke:currentColor;stroke-width:2;fill:none"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="fensterInhalt"></div>
    </div>
  </div>
</main>

<div id="dokumentmodus" class="versteckt"></div>
<noscript><p style="color:#fff;padding:20px">Dieses Spiel braucht JavaScript.</p></noscript>
